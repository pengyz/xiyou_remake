[package]
name = "game-shell-common"
version = "0.1.0"
edition = "2021"

# 壳间共享实现（lead F-4 裁决 2026-10-17）：game-platform 只放 trait 与类型，
# 可复用实现收敛于此，防双壳拷贝漂移。依赖面最小化：无 winit（Android 壳可直用）。
[dependencies]
game-core = { path = "../../crates/game-core" }
game-platform = { path = "../../crates/game-platform" }
# BGM：OGG Vorbis 解码（纯 Rust；与 tools/audio 自检同一解码器；随 decode_ogg 自
# shell/win 迁入，版本与那边原锁一致）
lewton = "=0.10.2"
# D2 字体缝共享实现（font.rs，2026-10-26 自 shell/win font_inject 迁入）：纯 Rust
# TTF/TTC 光栅（Android 可直用）；版本=Cargo.lock 既锁 0.2.32（零新增下载）。
ab_glyph = "=0.2.32"
