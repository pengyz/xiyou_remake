[package]
name = "game-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xiyou"
path = "src/main.rs"

[dependencies]
game-core = { path = "../../crates/game-core" }
game-data = { path = "../../crates/game-data" }
game-platform = { path = "../../crates/game-platform" }
# 壳间共享实现（FileRms/audio 共享面——lead F-4 裁决 2026-10-17，防双壳拷贝漂移）
game-shell-common = { path = "../common" }
winit = "0.30"
softbuffer = "0.4"
ab_glyph = "0.2"

# BGM 输出：运行时 dlopen libasound.so.2（无构建期系统依赖——cpal/rodio 经 alsa-sys
# 需 libasound2-dev + pkg-config）。版本与 winit 依赖树已锁定的 0.8.9 一致（零新增下载）。
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[build-dependencies]
# Windows 资源嵌入（app.ico 图标 + 版本信息；非 Windows 平台零动作——见 build.rs）
winresource = "0.1"
