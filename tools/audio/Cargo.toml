# tools/audio —— BGM 离线转换工具（.mid → .ogg），独立 workspace。
#
# 为什么不进 crates/：仓库根 workspace 的 members = ["crates/*"] 会把它拉进每次
# `cargo test --workspace`（门禁 rust-tests），而合成/编码依赖只在再生音频时需要。
# 空 [workspace] 表把本包声明为自身 workspace 根（cargo 不再向上归属到仓库根）。
#
# 依赖全部纯 Rust、零系统包（tools/README.md 工具链约定），版本 `=` 钉死 + Cargo.lock 入库。
[package]
name = "xiyou-audio-tool"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "midi2ogg"
path = "src/main.rs"

[dependencies]
# SoundFont 合成器 + MIDI 序列器（MIT，零依赖）
rustysynth = "=1.3.7"
# Vorbis 编码器（Apache-2.0，零依赖，纯 Rust）
rusty_vorbis = "=0.1.1"
# Ogg 容器写入（BSD-3-Clause）
ogg = "=0.9.2"
# Vorbis 解码器：产物自检（与桌面壳同一解码器；MIT OR Apache-2.0）
lewton = "=0.10.2"
# SHA-256：复用仓库内已过 FIPS 向量的实现（零依赖）
game-platform = { path = "../../crates/game-platform" }
# 轨道表单一真相源：game_core::audio::TRACKS（a.java:2239）
game-core = { path = "../../crates/game-core" }

[profile.release]
overflow-checks = true
